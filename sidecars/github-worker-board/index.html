<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Worker Board</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="board-container">
    <!-- Header -->
    <header class="board-header">
      <div class="header-main">
        <div class="header-title-row">
          <span class="board-icon">⚡</span>
          <h1 id="board-title" class="board-title">GitHub Worker Board</h1>
          <span id="repo-badge" class="badge repo-badge">...</span>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" title="Refresh Issues">
            <svg class="refresh-icon" viewBox="0 0 16 16" width="14" height="14">
              <path fill="currentColor" d="M8 3a5 5 0 0 0-4.546 2.914.5.5 0 0 1-.908-.418A6 6 0 0 1 14 8c0 3.314-2.686 6-6 6A6 6 0 0 1 2.086 9.454a.5.5 0 1 1 .908-.418A5 5 0 0 0 8 13a5 5 0 1 0 0-10zm-3 1.5a.5.5 0 0 1 .5.5v2.5a.5.5 0 0 1-.5.5H2.5a.5.5 0 0 1 0-1H4.3A5.02 5.02 0 0 1 5 4.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="header-toolbar">
        <div class="search-box">
          <input type="text" id="filter-input" placeholder="Filter issues or PRs..." autocomplete="off" />
        </div>
        <div class="toolbar-toggles">
          <label class="toggle-label" title="Hide completed items in Done column">
            <input type="checkbox" id="hide-done-checkbox" />
            <span>Hide Done</span>
          </label>
        </div>
      </div>
      <div id="status-bar" class="status-bar">
        <span id="last-updated-text">Loading issues...</span>
      </div>
    </header>

    <!-- Error message banner -->
    <div id="error-banner" class="error-banner" style="display: none;">
      <span id="error-message"></span>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <!-- Board Columns View -->
    <main id="columns-container" class="columns-container">
      <div class="skeleton-loader">
        <div class="skeleton-column"></div>
        <div class="skeleton-column"></div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
